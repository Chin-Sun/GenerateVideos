services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: drama
      POSTGRES_USER: drama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drama -d drama"]
      interval: 5s
      timeout: 3s
      retries: 12
  init:
    build: .
    env_file: .env
    environment: &runtime
      DRAMA_DATABASE_URL: postgresql+psycopg://drama:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/drama
      DRAMA_ASSET_ROOT: /data/assets
    volumes: ["assets:/data"]
    command: ["python", "-m", "drama_bot.runtime", "init-db"]
    depends_on:
      db: {condition: service_healthy}
  app:
    build: .
    env_file: .env
    environment: *runtime
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["assets:/data"]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 15s
      timeout: 3s
      retries: 3
  worker:
    build: .
    env_file: .env
    environment: *runtime
    volumes: ["assets:/data"]
    command: ["python", "-m", "drama_bot.runtime", "worker"]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; assert time.time()-float(pathlib.Path('/data/worker-heartbeat').read_text())<900"]
      interval: 60s
      timeout: 3s
      retries: 3
  ingress:
    build: .
    profiles: ["feishu"]
    env_file: .env
    environment: *runtime
    volumes: ["assets:/data"]
    command: ["python", "-m", "drama_bot.runtime", "ingress"]
    depends_on:
      init: {condition: service_completed_successfully}
volumes:
  pgdata:
  assets:
